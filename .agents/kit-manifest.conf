# kit-manifest.conf — machine-readable kit-owned path list.
#
# This is the SINGLE SOURCE OF TRUTH for "what does update-kit.{sh,ps1} touch."
# Before this file existed, the same list was hand-maintained in three places
# (docs/KIT-MANIFEST.md's prose table, update-kit.sh's KIT_OWNED_FILES array,
# update-kit.ps1's $kitOwnedFiles array) with nothing enforcing agreement
# between them. Now: both updaters read this file at run time (from the
# *source* checkout being updated to — see below), and CI's "Kit manifest doc
# matches kit-manifest.conf" step (.github/workflows/agent-harness.yml) fails
# the build if docs/KIT-MANIFEST.md's prose table omits an entry listed here.
#
# Edit THIS file to add/remove a kit-owned path, then mirror the change into
# docs/KIT-MANIFEST.md's table in the same commit (CI catches it if you forget)
# and call it out in KIT-CHANGELOG.md.
#
# update-kit.sh/.ps1 read this file from the SOURCE checkout ($SRC), not the
# project's own copy — the newer kit version's manifest is what decides what
# gets pulled in, same as KIT_VERSION.
#
# Format: "<namespace>=<path>", one per line, repeatable. Blank lines and
# lines starting with '#' are ignored. No quoting; leading/trailing
# whitespace around '=' is trimmed.
#
# Namespaces:
#   file=<path>     — whole-file kit-owned path. Copied verbatim (added or
#                      updated, never deleted — an upstream removal is called
#                      out in KIT-CHANGELOG.md and removed by hand).
#   dir=<path>       — whole-directory kit-owned path. Merged: files are
#                      added/updated from the source, nothing deleted.
#   adr_dir=<path>   — directory of the kit's own ADRs, matched by filename
#                      against the source checkout — project-authored ADRs
#                      (filenames the source doesn't have) are left alone.
#                      Currently unused (zero entries) — the kit's ADRs are no
#                      longer distributed; see the note below.
#   partial=<path>   — file that is only partially kit-owned: everything
#                      between its `# === KIT:BEGIN ===` / `# === KIT:END ===`
#                      markers is replaced; everything outside is preserved.
#                      Currently unused (zero entries) — see the note below on
#                      .githooks/pre-commit and agent-harness.yml.
#
# Unknown namespaces are a hard error at update time — add a case for it here
# and in both updaters' parsers, don't special-case a path in the scripts.
#
# NOT listed here on purpose: .githooks/pre-commit(.ps1) and
# .github/workflows/agent-harness.yml. Earlier versions of this file tracked
# both as `partial=` (KIT:BEGIN/KIT:END-scoped) paths, but a CI workflow isn't
# opt-in the way a git hook is — GitHub auto-runs anything under
# .github/workflows/ the moment it lands in a repo, which surprised adopters
# who already had their own CI. Both files still live in this repo (the kit
# uses them on itself, commented inline), but update-kit.sh
# no longer copies or updates them — an adopter who wants them copies them in
# by hand and owns them from that point on, like any other file this manifest
# doesn't list.
#
# ALSO not listed here on purpose: docs/adr/ (the kit's own ADRs). They
# record why the kit's own internals work the way they do — useful to kit
# maintainers, not to a downstream project's feature work (nothing in a
# shipped agent/skill file requires the ADR text itself, only the rule it
# justifies, which is always stated inline where it matters). Keeping a
# stale local snapshot of upstream design history in every adopting project
# is not worth the onboarding footprint. The 7 ADRs stay in this kit repo;
# an adopting project's own docs/adr/ starts fresh at 0001 with create-adr.

file=KIT_VERSION
file=KIT-CHANGELOG.md
file=docs/KIT-MANIFEST.md
file=.agents/kit-manifest.conf
file=.mcp.json.example
file=.gitattributes
file=LICENSE
file=scripts/mirror-agents.sh
file=scripts/mirror-agents.ps1
file=scripts/mirror-skills.sh
file=scripts/mirror-skills.ps1
file=scripts/quiet.sh
file=scripts/quiet.ps1
file=scripts/update-kit.sh
file=scripts/update-kit.ps1
file=docs/README.md
file=docs/guardrails.md

dir=.agents/agents
dir=.agents/skills
dir=.agents/extensions
dir=templates
